<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgriLink Zambia | Cloud Platform</title>
    <!-- Google Fonts for professional typography -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0f766e; --primary-hover: #0d9488; --bg-body: #f8fafc;
            --bg-card: #ffffff; --text-main: #0f172a; --text-muted: #64748b;
            --border: #e2e8f0; --danger: #dc2626; --success: #16a34a; --warning: #d97706;
            --radius: 8px; --shadow-sm: 0 1px 3px rgba(0,0,0,0.05); --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: var(--bg-body); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; }

        /* --- AUTH SCREEN --- */
        .auth-wrapper { display: flex; justify-content: center; align-items: center; flex: 1; padding: 20px; }
        .auth-card { background: var(--bg-card); padding: 40px; border-radius: var(--radius); box-shadow: var(--shadow-md); width: 100%; max-width: 400px; border: 1px solid var(--border); }
        .auth-card h1 { font-size: 24px; font-weight: 700; color: var(--primary); margin-bottom: 4px; }
        .auth-card p.sub { color: var(--text-muted); font-size: 14px; margin-bottom: 24px; }
        
        /* --- FORMS --- */
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: var(--text-main); }
        .form-control { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--radius); font-size: 14px; outline: none; transition: border-color 0.2s; }
        .form-control:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.1); }
        
        /* --- BUTTONS --- */
        .btn { padding: 10px 16px; border-radius: var(--radius); font-size: 14px; font-weight: 500; cursor: pointer; border: none; transition: all 0.2s; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-primary { background: var(--primary); color: white; width: 100%; }
        .btn-primary:hover { background: var(--primary-hover); }
        .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text-main); }
        .btn-outline:hover { background: var(--bg-body); }
        .btn-sm { padding: 6px 12px; font-size: 12px; }
        
        /* --- LAYOUT & TABS --- */
        .navbar { background: var(--bg-card); border-bottom: 1px solid var(--border); padding: 0 24px; height: 60px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
        .nav-brand { font-weight: 700; font-size: 18px; color: var(--primary); }
        .nav-user { display: flex; align-items: center; gap: 16px; font-size: 14px; }
        .container { max-width: 1200px; margin: 0 auto; padding: 24px; width: 100%; }
        
        .tabs-container { border-bottom: 1px solid var(--border); margin-bottom: 24px; display: flex; gap: 24px; }
        .tab-btn { background: none; border: none; padding: 12px 0; font-size: 14px; font-weight: 500; color: var(--text-muted); cursor: pointer; border-bottom: 2px solid transparent; transition: all 0.2s; margin-bottom: -1px; }
        .tab-btn:hover { color: var(--text-main); }
        .tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* --- CARDS & TABLES --- */
        .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-sm); margin-bottom: 24px; overflow: hidden; }
        .card-header { padding: 16px 20px; border-bottom: 1px solid var(--border); font-weight: 600; font-size: 15px; display: flex; justify-content: space-between; align-items: center; }
        .card-body { padding: 20px; }
        
        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 14px; }
        th { padding: 12px 20px; background: #f8fafc; font-weight: 600; color: var(--text-muted); border-bottom: 1px solid var(--border); font-size: 12px; text-transform: uppercase; }
        td { padding: 12px 20px; border-bottom: 1px solid var(--border); color: var(--text-main); }
        tr:last-child td { border-bottom: none; }
        
        .badge { padding: 4px 8px; border-radius: 12px; font-size: 11px; font-weight: 600; text-transform: capitalize; }
        .badge-success { background: #dcfce7; color: #166534; }
        .badge-warning { background: #fef3c7; color: #92400e; }
        .badge-info { background: #e0f2fe; color: #075985; }

        /* --- MODALS --- */
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 1000; justify-content: center; align-items: center; backdrop-filter: blur(2px); }
        .modal-overlay.active { display: flex; }
        .modal { background: var(--bg-card); width: 100%; max-width: 500px; border-radius: var(--radius); box-shadow: var(--shadow-md); overflow: hidden; animation: modalIn 0.2s ease-out; }
        @keyframes modalIn { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .modal-header { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; font-weight: 600; }
        .modal-body { padding: 20px; }
        .modal-footer { padding: 16px 20px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 12px; background: #f8fafc; }
        .close-btn { background: none; border: none; font-size: 20px; cursor: pointer; color: var(--text-muted); }

        /* --- RECEIPT SPECIFIC STYLES --- */
        .receipt-box { border: 1px dashed var(--border); padding: 20px; border-radius: var(--radius); background: #fff; font-family: monospace; font-size: 13px; }
        .receipt-header { text-align: center; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
        .receipt-row { display: flex; justify-content: space-between; margin-bottom: 8px; }
        .receipt-total { display: flex; justify-content: space-between; margin-top: 16px; padding-top: 16px; border-top: 2px dashed var(--border); font-weight: bold; font-size: 16px; }
        .receipt-stamp { text-align: center; margin-top: 20px; color: var(--success); font-weight: bold; border: 2px solid var(--success); padding: 8px; border-radius: 4px; transform: rotate(-5deg); opacity: 0.8; }

        .alert { padding: 12px 16px; border-radius: var(--radius); margin-bottom: 16px; font-size: 14px; }
        .alert-error { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
        .text-muted { color: var(--text-muted); } .fw-bold { font-weight: 600; }
    </style>
</head>
<body>

<!-- AUTH -->
<div id="authScreen" class="auth-wrapper">
    <div class="auth-card">
        <h1>AgriLink Zambia</h1>
        <p class="sub">Cloud Agricultural Platform</p>
        <div id="authAlert"></div>
        <div id="loginForm">
            <div class="form-group"><label>Phone or Email</label><input type="text" id="loginIdentifier" class="form-control" placeholder="e.g. 0977123456"></div>
            <div class="form-group"><label>Password</label><input type="password" id="loginPassword" class="form-control" placeholder="••••••••"></div>
            <button class="btn btn-primary" onclick="handleLogin()">Sign In</button>
        </div>
    </div>
</div>

<!-- APP -->
<div id="appScreen" style="display: none; flex-direction: column; min-height: 100vh;">
    <nav class="navbar">
        <div class="nav-brand">🌾 AgriLink Zambia</div>
        <div class="nav-user">
            <span class="text-muted" id="navUserName"></span>
            <button class="btn btn-outline btn-sm" onclick="handleLogout()">Logout</button>
        </div>
    </nav>
    <div class="container">
        <div class="tabs-container" id="mainTabs"></div>
        <div id="tabContent"></div>
    </div>
</div>

<!-- GENERIC MODAL -->
<div class="modal-overlay" id="modal">
    <div class="modal">
        <div class="modal-header"><span id="modalTitle">Modal</span><button class="close-btn" onclick="closeModal()">&times;</button></div>
        <div class="modal-body" id="modalBody"></div>
        <div class="modal-footer" id="modalFooter"></div>
    </div>
</div>

<script>
/* --- DATA LAYER --- */
const SUPABASE_URL = 'https://fsepjaslhgvwnxouaney.supabase.co';
const SUPABASE_KEY = 'sb_publishable_MWcMNMAs1XFjgODMv8KcIA_7Jq-5QT3';

const DB = {
    headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json', 'Prefer': 'return=representation' },
    _cache: {},
    async get(table, forceRefresh = false) {
        if (this._cache[table] && !forceRefresh) return this._cache[table];
        const res = await fetch(`${SUPABASE_URL}/rest/v1/${table}?select=*`, { headers: this.headers });
        if(!res.ok) throw new Error(await res.text());
        const data = await res.json();
        this._cache[table] = data;
        return data;
    },
    clearCache(table) { if (table) delete this._cache[table]; else this._cache = {}; },
    async insert(table, data) {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/${table}`, { method: 'POST', headers: this.headers, body: JSON.stringify(data) });
        if(!res.ok) throw new Error(await res.text());
        this.clearCache(table);
        return res.json();
    },
    async update(table, id, data) {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/${table}?id=eq.${id}`, { method: 'PATCH', headers: this.headers, body: JSON.stringify(data) });
        if(!res.ok) throw new Error(await res.text());
        this.clearCache(table);
        return res.json();
    }
};

/* --- AUTH --- */
let currentUser = null;
async function handleLogin() {
    const id = document.getElementById('loginIdentifier').value.trim();
    const pw = document.getElementById('loginPassword').value;
    if(!id || !pw) return showAlert('Please enter credentials');
    try {
        const users = await DB.get('users', true); 
        const user = users.find(u => (u.phone === id || u.email === id) && u.password === pw);
        if(!user) return showAlert('Invalid credentials');
        if(!user.verified) return showAlert('Account pending admin verification');
        
        currentUser = user;
        document.getElementById('authScreen').style.display = 'none';
        document.getElementById('appScreen').style.display = 'flex';
        document.getElementById('navUserName').textContent = user.name + ' (' + user.role + ')';
        buildTabs();
    } catch(e) { showAlert('Connection failed: ' + e.message); }
}
function showAlert(msg) { document.getElementById('authAlert').innerHTML = `<div class="alert alert-error">${msg}</div>`; }
function handleLogout() { currentUser = null; DB.clearCache(); document.getElementById('appScreen').style.display = 'none'; document.getElementById('authScreen').style.display = 'flex'; document.getElementById('loginPassword').value = ''; }

/* --- TABS --- */
function buildTabs() {
    const tabsContainer = document.getElementById('mainTabs');
    const contentContainer = document.getElementById('tabContent');
    let tabs = [];
    if(currentUser.role === 'admin') tabs = [{ id: 'dashboard', label: 'Dashboard' }, { id: 'users', label: 'User Verification' }, { id: 'prices', label: 'Manage Prices' }];
    else if(currentUser.role === 'buyer') tabs = [{ id: 'browse', label: 'Browse Produce' }, { id: 'transactions', label: 'My Purchases' }];
    else if(currentUser.role === 'farmer' || currentUser.role === 'cooperative') tabs = [{ id: 'listings', label: 'My Listings' }, { id: 'offers', label: 'Offers Received' }, { id: 'transactions', label: 'Transactions' }];
    else if(currentUser.role === 'transporter') tabs = [{ id: 'jobs', label: 'Available Jobs' }, { id: 'transactions', label: 'My Deliveries' }];

    tabsContainer.innerHTML = tabs.map((t, i) => `<button class="tab-btn ${i === 0 ? 'active' : ''}" onclick="switchTab('${t.id}', this)">${t.label}</button>`).join('');
    contentContainer.innerHTML = tabs.map((t, i) => `<div id="tab-${t.id}" class="tab-content ${i === 0 ? 'active' : ''}"><div class="card"><div class="card-body">Loading data...</div></div></div>`).join('');
    loadTabData(tabs[0].id);
}

function switchTab(tabId, btn) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    document.getElementById('tab-' + tabId).classList.add('active');
    loadTabData(tabId);
}

/* --- TAB DATA --- */
async function loadTabData(tabId) {
    const container = document.getElementById('tab-' + tabId);
    try {
        if(tabId === 'dashboard') {
            const users = await DB.get('users');
            const listings = await DB.get('listings');
            container.innerHTML = `
                <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 24px;">
                    <div class="card" style="padding: 20px;"><div class="text-muted">Total Users</div><div style="font-size: 28px; font-weight: 700; color: var(--primary);">${users.length}</div></div>
                    <div class="card" style="padding: 20px;"><div class="text-muted">Active Listings</div><div style="font-size: 28px; font-weight: 700; color: var(--primary);">${listings.filter(l=>l.status==='available').length}</div></div>
                    <div class="card" style="padding: 20px;"><div class="text-muted">Pending Users</div><div style="font-size: 28px; font-weight: 700; color: var(--warning);">${users.filter(u=>!u.verified).length}</div></div>
                </div>`;
        }
        else if(tabId === 'users') {
            const users = await DB.get('users');
            container.innerHTML = `<div class="card"><table><thead><tr><th>Name</th><th>Role</th><th>Status</th><th>Action</th></tr></thead><tbody>${users.map(u => `<tr><td class="fw-bold">${u.name}</td><td>${u.role}</td><td>${u.verified ? '<span class="badge badge-success">Verified</span>' : '<span class="badge badge-warning">Pending</span>'}</td><td>${!u.verified ? `<button class="btn btn-primary btn-sm" onclick="verifyUser('${u.id}')">Approve</button>` : '-'}</td></tr>`).join('')}</tbody></table></div>`;
        }
        else if(tabId === 'browse') {
            const listings = await DB.get('listings');
            container.innerHTML = `<div class="card"><div class="card-header">Available Produce</div><table><thead><tr><th>Crop</th><th>Quantity</th><th>Price</th><th>Action</th></tr></thead><tbody>${listings.filter(l=>l.status==='available').map(l => `<tr><td class="fw-bold">${l.crop}</td><td>${l.quantity} ${l.unit}</td><td>ZMW ${Number(l.price_per_unit).toFixed(2)}</td><td><button class="btn btn-primary btn-sm" onclick="openPaymentModal('${l.id}')">Buy Now</button></td></tr>`).join('')}</tbody></table></div>`;
        }
        else if(tabId === 'transactions' || tabId === 'offers' || tabId === 'listings') {
            const txns = await DB.get('transactions');
            let filtered = txns;
            if(currentUser.role === 'buyer') filtered = txns.filter(t => t.buyer_id === currentUser.id);
            else if(currentUser.role === 'farmer') filtered = txns.filter(t => t.seller_id === currentUser.id);
            
            container.innerHTML = `<div class="card"><div class="card-header">Transactions</div><table><thead><tr><th>ID</th><th>Crop</th><th>Total</th><th>Status</th><th>Action</th></tr></thead><tbody>${filtered.map(t => `<tr><td>${t.id.substring(0,8)}</td><td>${t.crop}</td><td class="fw-bold">ZMW ${Number(t.total_amount).toFixed(2)}</td><td><span class="badge badge-info">${t.status}</span></td><td><button class="btn btn-outline btn-sm" onclick="openReceipt('${t.id}')">View Receipt</button></td></tr>`).join('')}</tbody></table></div>`;
        }
    } catch(e) { container.innerHTML = `<div class="alert alert-error">Error: ${e.message}</div>`; }
}

/* --- FEATURE: SIMULATED MOBILE MONEY & RECEIPT --- */
let pendingListing = null;

async function openPaymentModal(listingId) {
    const listings = await DB.get('listings');
    pendingListing = listings.find(l => l.id === listingId);
    if(!pendingListing) return;

    const total = pendingListing.quantity * pendingListing.price_per_unit;

    document.getElementById('modalTitle').textContent = 'Simulated Mobile Money Checkout';
    document.getElementById('modalBody').innerHTML = `
        <div style="text-align: center; margin-bottom: 20px;">
            <div style="font-size: 32px; margin-bottom: 8px;">📱</div>
            <h3 style="margin-bottom: 4px;">Pay with Mobile Money</h3>
            <p class="text-muted">Secure simulated transaction</p>
        </div>
        <div class="form-group">
            <label>Phone Number (MTN/Airtel)</label>
            <input type="text" id="payPhone" class="form-control" value="${currentUser.phone}" placeholder="e.g. 0961234567">
        </div>
        <div class="form-group">
            <label>Amount (ZMW)</label>
            <input type="text" class="form-control fw-bold" value="${total.toFixed(2)}" readonly style="background: #f1f5f9;">
        </div>
        <div style="font-size: 12px; color: var(--text-muted); text-align: center; margin-top: 10px;">
            By clicking "Pay Now", you authorize a simulated transfer to Escrow.
        </div>
    `;
    document.getElementById('modalFooter').innerHTML = `
        <button class="btn btn-outline" onclick="closeModal()">Cancel</button>
        <button class="btn btn-primary" onclick="processPayment()">Pay Now (Simulated)</button>
    `;
    document.getElementById('modal').classList.add('active');
}

async function processPayment() {
    const btn = document.querySelector('#modalFooter .btn-primary');
    btn.textContent = 'Processing...';
    btn.disabled = true;

    // Simulate network delay for payment gateway
    setTimeout(async () => {
        const txnId = 'TXN-' + Math.floor(Math.random() * 1000000);
        const txnData = {
            id: txnId,
            listing_id: pendingListing.id,
            crop: pendingListing.crop,
            quantity: pendingListing.quantity,
            unit: pendingListing.unit,
            price_per_unit: pendingListing.price_per_unit,
            total_amount: pendingListing.quantity * pendingListing.price_per_unit,
            buyer_id: currentUser.id,
            seller_id: pendingListing.farmer_id,
            status: 'paid_escrow',
            need_transport: false,
            created_at: new Date().toISOString()
        };

        try {
            await DB.insert('transactions', txnData);
            await DB.update('listings', pendingListing.id, { status: 'sold' });
            
            closeModal();
            switchTab('transactions', document.querySelector('[onclick*="transactions"]'));
            
            // Automatically open the receipt immediately after payment
            setTimeout(() => openReceipt(txnId), 500);
        } catch(e) {
            alert('Payment failed: ' + e.message);
            btn.textContent = 'Pay Now (Simulated)';
            btn.disabled = false;
        }
    }, 1500); // 1.5 second fake processing delay
}

async function openReceipt(txnId) {
    const txns = await DB.get('transactions');
    const t = txns.find(x => x.id === txnId);
    if(!t) return;

    const dateStr = new Date(t.created_at).toLocaleString();

    document.getElementById('modalTitle').textContent = 'Official Digital Receipt';
    document.getElementById('modalBody').innerHTML = `
        <div class="receipt-box">
            <div class="receipt-header">
                <h3 style="margin-bottom: 4px;">AGRI-LINK ZAMBIA</h3>
                <div>Digital Escrow Receipt</div>
            </div>
            <div class="receipt-row"><span>Txn ID:</span> <span>${t.id}</span></div>
            <div class="receipt-row"><span>Date:</span> <span>${dateStr}</span></div>
            <div class="receipt-row"><span>Buyer:</span> <span>${currentUser.name}</span></div>
            <hr style="border: none; border-top: 1px dashed var(--border); margin: 10px 0;">
            <div class="receipt-row"><span>Item:</span> <span>${t.crop}</span></div>
            <div class="receipt-row"><span>Quantity:</span> <span>${t.quantity} ${t.unit}</span></div>
            <div class="receipt-row"><span>Unit Price:</span> <span>ZMW ${Number(t.price_per_unit).toFixed(2)}</span></div>
            <div class="receipt-total"><span>TOTAL PAID:</span> <span>ZMW ${Number(t.total_amount).toFixed(2)}</span></div>
            <div class="receipt-stamp">PAID VIA MOMO</div>
            <div style="text-align: center; margin-top: 15px; font-size: 10px; color: #888;">
                This is a simulated transaction generated for the AgriLink prototype.<br>
                Funds held securely in Escrow until delivery is confirmed.
            </div>
        </div>
    `;
    document.getElementById('modalFooter').innerHTML = `
        <button class="btn btn-outline" onclick="closeModal()">Close</button>
        <button class="btn btn-primary" onclick="window.print()">Print Receipt</button>
    `;
    document.getElementById('modal').classList.add('active');
}

/* --- HELPERS --- */
function closeModal() { document.getElementById('modal').classList.remove('active'); }
async function verifyUser(id) { await DB.update('users', id, { verified: true }); loadTabData('users'); }
</script>
</body>
</html>
